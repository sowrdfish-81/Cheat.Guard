name: Release
# Rafa owns release automation; build output comes from build-installer.bat.

# Builds, tests, optionally signs, and publishes the installer for a version
# tag such as v1.9.0. The certificate NEVER enters the repository: it arrives
# as a base64 secret, is decoded only into this runner's temp folder, is used
# for signing, and is deleted in a finally block even when signing fails.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Release build (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate PowerShell syntax (all tracked .ps1 files)
        shell: pwsh
        run: ./test/ps1-syntax-check.ps1

      - name: Compile all Java sources and tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-classes | Out-Null
          New-Item -ItemType Directory -Force test-classes | Out-Null
          $sources = Get-ChildItem -Recurse src -Filter *.java | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 --release 17 -d build-classes $sources
          if ($LASTEXITCODE -ne 0) { throw "Java compilation failed" }
          $tests = Get-ChildItem test -Filter *.java | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 --release 17 -cp build-classes -d test-classes $tests
          if ($LASTEXITCODE -ne 0) { throw "Test compilation failed" }

      - name: Run every headless test
        shell: pwsh
        run: |
          $cp = "build-classes;test-classes"
          $tests = @(
            @{ Name = 'CoreFlowTest';        Class = 'CoreFlowTest' },
            @{ Name = 'SecurityUpgradeTest'; Class = 'SecurityUpgradeTest' },
            @{ Name = 'UpdateCheckerTest';   Class = 'com.cheatguard.config.UpdateCheckerTest' },
            @{ Name = 'CentralTlsTest';      Class = 'CentralTlsTest' },
            @{ Name = 'BackupRotationTest';  Class = 'BackupRotationTest' }
          )
          $failed = @()
          foreach ($t in $tests) {
            $dataDir = Join-Path $env:RUNNER_TEMP ("cgdata-" + [guid]::NewGuid().ToString('N'))
            Write-Host "==> $($t.Name)"
            java "-Dcheatguard.data.dir=$dataDir" -cp $cp $t.Class
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw "Headless tests failed: $($failed -join ', ')" }

      - name: Download WiX Toolset 3.14
        shell: pwsh
        run: |
          $wixUrl = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          New-Item -ItemType Directory -Force tools/wix | Out-Null
          Invoke-WebRequest -Uri $wixUrl -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath tools/wix -Force
          if (-not (Test-Path 'tools/wix/candle.exe') -or -not (Test-Path 'tools/wix/light.exe')) {
            throw "WiX binaries missing after download"
          }

      - name: Build installer
        shell: cmd
        run: build-installer.bat

      - name: Sign installer (skipped cleanly when secrets are absent)
        id: sign
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64 -or -not $env:WINDOWS_CERTIFICATE_PASSWORD) {
            Write-Host "##[warning]Signing SKIPPED: the WINDOWS_CERTIFICATE_BASE64 and"
            Write-Host "##[warning]WINDOWS_CERTIFICATE_PASSWORD repository secrets are not configured."
            Write-Host "##[warning]The published installer will be unsigned."
            "result" + "=skipped" | Set-Content $env:GITHUB_OUTPUT
            exit 0
          }
          $certPath = Join-Path $env:RUNNER_TEMP 'codesigning.pfx'
          try {
            [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw "signtool.exe not found in the Windows SDK" }
            & $signtool.FullName sign /f $certPath /p $env:WINDOWS_CERTIFICATE_PASSWORD `
              /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 'dist\Cheat.Guard-Setup.exe'
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed with exit code $LASTEXITCODE" }
            & $signtool.FullName verify /pa /all 'dist\Cheat.Guard-Setup.exe'
            if ($LASTEXITCODE -ne 0) { throw "signtool verify failed with exit code $LASTEXITCODE" }
            "result" + "=signed" | Set-Content $env:GITHUB_OUTPUT
            Write-Host "Installer signed (SHA-256, RFC 3161 timestamp)."
          } finally {
            # The decoded certificate is wiped no matter how signing ended.
            if (Test-Path $certPath) {
              Remove-Item -Force $certPath
              Remove-Item -Force (Join-Path $env:RUNNER_TEMP 'codesigning.pfx') -ErrorAction SilentlyContinue
            }
          }

      - name: Regenerate checksum AFTER signing and verify it
        shell: pwsh
        run: |
          $exe = 'dist/Cheat.Guard-Setup.exe'
          $sum = 'dist/Cheat.Guard-Setup.exe.sha256'
          if (-not (Test-Path $exe)) { throw "Installer is missing" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($sum, ($hash + '  ' + (Split-Path $exe -Leaf) + [Environment]::NewLine),
            [Text.Encoding]::ASCII)
          $reread = ((Get-Content $sum -Raw).Trim() -split '\s+')[0]
          if ($reread -ne $hash) { throw "Checksum file does not round-trip" }
          Write-Host "Final installer SHA-256: $hash"

      - name: Upload release artifacts for inspection
        uses: actions/upload-artifact@v4
        with:
          name: Cheat.Guard-Setup-release
          path: |
            dist/Cheat.Guard-Setup.exe
            dist/Cheat.Guard-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = "release-notes/$tag.md"
          $ghArgs = @('release', 'create', $tag,
            'dist/Cheat.Guard-Setup.exe', 'dist/Cheat.Guard-Setup.exe.sha256',
            '--title', "Cheat.Guard $tag",
            '--target', $env:GITHUB_SHA)
          if (Test-Path $notes) {
            $ghArgs += @('--notes-file', $notes)
            Write-Host "Using release notes from $notes"
          } else {
            $ghArgs += '--generate-notes'
            Write-Host "No release-notes/$tag.md found; using generated notes"
          }
          & gh @ghArgs
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
          Write-Host "Release $tag published."
