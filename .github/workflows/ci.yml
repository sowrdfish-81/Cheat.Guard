name: CI
# Rafa owns CI orchestration; jobs validate each product boundary.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: Build, test, package (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: git diff --check (no whitespace errors)
        shell: bash
        run: |
          BASE_REF="${{ github.base_ref }}"
          if [ -z "$BASE_REF" ]; then BASE_REF="main"; fi
          BASE_SHA="$(git merge-base "origin/$BASE_REF" HEAD 2>/dev/null || echo '4b825dc642cb6eb9a060e54bf8d69288fbee4904')"
          echo "Checking whitespace errors between $BASE_SHA and HEAD"
          git diff --check "$BASE_SHA" HEAD

      - name: Validate PowerShell syntax (all tracked .ps1 files)
        shell: pwsh
        run: ./test/ps1-syntax-check.ps1

      - name: Compile all Java sources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build-classes | Out-Null
          $sources = Get-ChildItem -Recurse src -Filter *.java | ForEach-Object { $_.FullName }
          if (-not $sources) { throw "No Java sources found" }
          javac -encoding UTF-8 --release 17 -d build-classes $sources
          if ($LASTEXITCODE -ne 0) { throw "Java compilation failed" }

      - name: Compile headless tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-classes | Out-Null
          $sources = Get-ChildItem test -Filter *.java | ForEach-Object { $_.FullName }
          javac -encoding UTF-8 --release 17 -cp build-classes -d test-classes $sources
          if ($LASTEXITCODE -ne 0) { throw "Test compilation failed" }

      - name: Run every headless test (isolated data dir each)
        shell: pwsh
        run: |
          $cp = "build-classes;test-classes"
          $tests = @(
            @{ Name = 'CoreFlowTest';        Class = 'CoreFlowTest' },
            @{ Name = 'SecurityUpgradeTest'; Class = 'SecurityUpgradeTest' },
            @{ Name = 'UpdateCheckerTest';   Class = 'com.cheatguard.config.UpdateCheckerTest' },
            @{ Name = 'CentralTlsTest';      Class = 'CentralTlsTest' },
            @{ Name = 'BackupRotationTest';  Class = 'BackupRotationTest' }
          )
          $failed = @()
          foreach ($t in $tests) {
            $dataDir = Join-Path $env:RUNNER_TEMP ("cgdata-" + [guid]::NewGuid().ToString('N'))
            Write-Host "==> $($t.Name) (data dir: $dataDir)"
            java "-Dcheatguard.data.dir=$dataDir" -cp $cp $t.Class
            if ($LASTEXITCODE -ne 0) { $failed += $t.Name }
          }
          if ($failed.Count -gt 0) { throw "Headless tests failed: $($failed -join ', ')" }

      - name: Download WiX Toolset 3.14
        shell: pwsh
        run: |
          $wixUrl = 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip'
          $zip = Join-Path $env:RUNNER_TEMP 'wix314-binaries.zip'
          New-Item -ItemType Directory -Force tools/wix | Out-Null
          Invoke-WebRequest -Uri $wixUrl -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath tools/wix -Force
          if (-not (Test-Path 'tools/wix/candle.exe') -or -not (Test-Path 'tools/wix/light.exe')) {
            throw "WiX binaries missing after download"
          }
          Write-Host "WiX 3.14 downloaded to tools/wix"

      - name: Build installer
        shell: cmd
        run: build-installer.bat

      - name: Verify installer checksum
        shell: pwsh
        run: |
          $exe = 'dist/Cheat.Guard-Setup.exe'
          $sum = 'dist/Cheat.Guard-Setup.exe.sha256'
          if (-not (Test-Path $exe)) { throw "Installer was not produced" }
          if (-not (Test-Path $sum)) { throw "Checksum file was not produced" }
          $expected = (Get-Content $sum -Raw).Trim()
          if ($expected -notmatch '^[0-9a-f]{64}\s') { throw "Checksum file is not a SHA-256 line: $expected" }
          $expected = ($expected -split '\s+')[0]
          $actual = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Checksum mismatch: file $actual vs recorded $expected" }
          Write-Host "Checksum verified: $actual"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cheat.Guard-Setup
          path: |
            dist/Cheat.Guard-Setup.exe
            dist/Cheat.Guard-Setup.exe.sha256
          if-no-files-found: error
